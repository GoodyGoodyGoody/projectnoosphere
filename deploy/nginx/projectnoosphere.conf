# DRAFT for review — not installed. Launch step "nginx" (docs/launch.md) installs it.
# Base: generated by ~/bin/gen-vhost.sh from the planned sites.json entry (2026-09-30).
# Added by hand below: a per-address rate limit on the two search endpoints.
# Search runs a full-text query per request and robots.txt binds no scraper
# (the batlas crawl-trap lesson); every other path is left to the house limits.
# certbot adds the 443 block, ssl lines and the 80→443 redirect when it runs.

limit_req_zone $binary_remote_addr zone=noosphere_search:10m rate=30r/m;
# The hosted MCP endpoint: its tools reach search in-process, so it needs its own
# limit, at least as strict as search's (one tool call = one POST /mcp).
limit_req_zone $binary_remote_addr zone=noosphere_mcp:10m rate=30r/m;

# projectnoosphere — generated by ~/bin/gen-vhost.sh from ~/bin/sites.json
# HTTP only. Run certbot (below) and it will add the 443 block, the ssl_* lines
# and the port-80 redirect itself.
server {
    listen 80;
    server_name projectnoosphere.org;

    access_log /var/log/nginx/projectnoosphere.access.log;
    error_log /var/log/nginx/projectnoosphere.error.log;




    # 30 searches/minute per address, bursts of 20 answered at once; beyond
    # that nginx returns 429 before the app does any work.
    location = /search {
        limit_req zone=noosphere_search burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        limit_req zone=noosphere_mcp burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/search {
        limit_req zone=noosphere_search burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {

        # Drop server-action POSTs with a malformed reference ID before they
        # reach Next. Without this, any anonymous POST carrying a junk
        # Next-Action header makes Next write a three-line ERROR — 480 of them
        # filled 99% of glaamrg's error log on 2026-08-14. Harmless on a
        # non-Next app: nothing else sends that header.
        include /etc/nginx/sites-available/next-action-guard.inc;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Hashed filenames — safe to cache forever, and it keeps the Node process
    # out of the path for static assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3012;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# www serves nothing itself — 301 to the apex so Google sees one canonical
# origin. The redirect lives in `location /`, NOT as a server-level `return`:
# certbot proves control of www by dropping a file under
# /.well-known/acme-challenge/, and a server-level return runs in the rewrite
# phase and would swallow that request, so the cert could never be issued.
server {
    listen 80;
    server_name www.projectnoosphere.org;

    access_log /var/log/nginx/projectnoosphere.access.log;
    error_log /var/log/nginx/projectnoosphere.error.log;

    location / {
        return 301 https://projectnoosphere.org$request_uri;
    }
}
